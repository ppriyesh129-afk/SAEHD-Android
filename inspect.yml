name: Inspect SAEHD Model

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install NumPy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check model directory
        run: |
          mkdir -p model
          find model -maxdepth 1 -type f -printf '%f %s bytes\n' || true

      - name: Inspect model
        run: |
          python tools/inspect_model.py
