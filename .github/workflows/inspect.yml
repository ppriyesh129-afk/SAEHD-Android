name: Inspect DeepFaceLab SAEHD Model

on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SAEHD-Android
        uses: actions/checkout@v4

      - name: Checkout DeepFaceLab
        uses: actions/checkout@v4
        with:
          repository: iperov/DeepFaceLab
          path: third_party/DeepFaceLab

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install NumPy
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4

      - name: Install TensorFlow
        run: |
          pip install tensorflow==2.15.1

      - name: Download official LIAE model
        run: |
          mkdir -p model
          wget -O /tmp/LIAE.zip \
            "https://sourceforge.net/projects/deepfacelab.mirror/files/pretrained/LIAE.f-128-80-48-16-1.000.000.zip/download"

      - name: Extract model
        run: |
          mkdir -p model
          unzip -o /tmp/LIAE.zip -d model

          echo "=== EXTRACTED FILES ==="
          find model -type f -printf '%f %s bytes\n'

      - name: Locate model files
        run: |
          echo "=== SEARCHING FOR SAEHD WEIGHTS ==="
          find model -type f \
            \( -name "*encoder*.npy" \
            -o -name "*inter_AB*.npy" \
            -o -name "*inter_B*.npy" \
            -o -name "*decoder*.npy" \) \
            -print

      - name: Prepare model directory
        run: |
          mkdir -p model

          find model -type f -name "*encoder*.npy" \
            -exec cp {} model/new_SAEHD_encoder.npy \;

          find model -type f -name "*inter_AB*.npy" \
            -exec cp {} model/new_SAEHD_inter_AB.npy \;

          find model -type f -name "*inter_B*.npy" \
            -exec cp {} model/new_SAEHD_inter_B.npy \;

          find model -type f -name "*decoder.npy" \
            -exec cp {} model/new_SAEHD_decoder.npy \;

          echo "=== FINAL MODEL FILES ==="
          ls -lh model/*.npy

      - name: Verify DeepFaceLab source
        run: |
          test -f third_party/DeepFaceLab/core/leras/archis/DeepFakeArchi.py
          echo "DeepFaceLab source found."

      - name: Derive exact LIAE architecture
        run: |
          python tools/derive_liae.py

      - name: Run inspector
        run: |
          python tools/inspect_model.py

      - name: Test LIAE inference
        run: |
          python converter/test_inference.py
