name: Inspect DeepFaceLab SAEHD Model

on:
workflow_dispatch:

jobs:
inspect:
runs-on: ubuntu-22.04

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Checkout DeepFaceLab source
    uses: actions/checkout@v4
    with:
      repository: iperov/DeepFaceLab
      path: third_party/DeepFaceLab

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Check model files
    run: |
      echo "=== MODEL DIRECTORY ==="
      mkdir -p model
      find model -maxdepth 1 -type f -printf '%f %s bytes\n' || true

  - name: Inspect model
    run: |
      python tools/inspect_model.py
